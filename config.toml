# Agent Bridge 本地配置
host = "127.0.0.1"
port = 8787

# 本地客户端鉴权。留空则不校验；Codex / Claude Code 可填任意占位值
api_key = "sk-local-bridge"

# cn = 国内 CodeBuddy / WorkBuddy（copilot.tencent.com）
# global = 国际 CodeBuddy（www.codebuddy.ai）
# workbuddy = 国际 WorkBuddy（www.workbuddy.ai）
network = "cn"

default_model = "glm-5.2"
desensitize = true

# 可选：手动指定桌面端 auth 目录或桥自己的凭据文件
# auth_dir = ""
# credentials_file = "C:/Users/你的用户名/.agent-bridge/credentials.json"

# Codex / Claude Code 客户端常用模型名 → 腾讯后端真实模型
[aliases]
# 1. Codex / Claude 客户端通用映射
"claude" = "glm-5.2"
"claude-sonnet-4" = "glm-5.2"
"claude-sonnet-4-5" = "glm-5.3"
"claude-3-5-sonnet" = "glm-5.2"
"claude-3-7-sonnet" = "glm-5.2"
"claude-opus-4" = "deepseek-v4-pro"
"claude-haiku" = "glm-5.3-flash"
"gpt-5" = "glm-5.2"
"gpt-5-codex" = "glm-5.2"
"gpt-4.1" = "glm-5.2"
"codex" = "glm-5.2"
"o3" = "deepseek-v4-pro"

# 2. DeepSeek 系列 (Deepseek-V4.1-Flash / Deepseek-V4-Pro)
"Deepseek-V4.1-Flash" = "deepseek-v4.1-flash"
"deepseek-v4.1-flash" = "deepseek-v4.1-flash"
"deepseek-flash" = "deepseek-v4.1-flash"
"Deepseek-V4-Pro" = "deepseek-v4-pro"
"deepseek-v4-pro" = "deepseek-v4-pro"
"deepseek" = "deepseek-v4-pro"

# 3. 智谱 GLM 系列 (GLM-5.3 / GLM-5.3-Flash / GLM-5.2 / GLM-5.1)
"GLM-5.3" = "glm-5.3"
"glm-5.3" = "glm-5.3"
"GLM-5.3-Flash" = "glm-5.3-flash"
"glm-5.3-flash" = "glm-5.3-flash"
"GLM-5.2" = "glm-5.2"
"glm-5.2" = "glm-5.2"
"GLM-5.1" = "glm-5.1"
"glm-5.1" = "glm-5.1"

# 4. 月之暗面 Kimi 系列 (Kimi-K3)
"Kimi-K3" = "kimi-k3"
"kimi-k3" = "kimi-k3"
"kimi" = "kimi-k3"

# 5. MiniMax 系列 (MiniMax-M3)
"MiniMax-M3" = "minimax-m3"
"minimax-m3" = "minimax-m3"
"minimax" = "minimax-m3"